name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Custom Release Tag (e.g. v1.0.1)'
        required: false
        default: 'latest'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🚀 Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛠️ Build APK on EAS
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --output ./truepace-latest.apk

      - name: 📤 Upload APK Artifact to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: truepace-latest-apk
          path: ./truepace-latest.apk
          retention-days: 14

      - name: 🏷️ Determine Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.release_tag }}" ] && [ "${{ github.event.inputs.release_tag }}" != "latest" ]; then
            echo "TAG_NAME=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=latest" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: "TruePace Android APK (${{ steps.vars.outputs.TAG_NAME }})"
          body: |
            ## ⚡ TruePace Android Release
            
            **Commit:** ${{ github.sha }}
            **Built at:** ${{ github.event.head_commit.timestamp || github.event.created_at }}
            
            ### 📱 Installation Instructions:
            1. Download `truepace-latest.apk` below directly to your Android device.
            2. Open the downloaded file and tap **Install** (allow *Install from Unknown Sources* if prompted).
            3. Enjoy precision tracking without ads or live map battery drain!
          files: ./truepace-latest.apk
          prerelease: ${{ steps.vars.outputs.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
